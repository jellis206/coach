[package]
name = "coach"
version = "0.1.2"
edition = "2024"
rust-version = "1.95"

[dependencies]
clap = { version = "4.6.7", features = ["derive"] }
libc = "0.2.191"
regex = "1.13.1"
rusqlite = { version = "0.41.0", features = ["bundled"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sysinfo = "0.39.6"

[dev-dependencies]
rusqlite = { version = "0.41.0", features = ["bundled"] }
tempfile = "3.27.0"

[profile.release]
lto = true
codegen-units = 1
strip = true
